<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Subject & Case Converter Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Prevent Page Text Selection (Protection) */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Allow selection inside Textareas & Inputs */
        textarea, input {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        /* Custom Selected Button Styles */
        .btn-selected-decode {
            background-color: #0d9488 !important; /* Teal */
            border-color: #2dd4bf !important;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
            color: #ffffff !important;
        }
        .btn-selected-b64 {
            background-color: #2563eb !important; /* Blue */
            border-color: #60a5fa !important;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
            color: #ffffff !important;
        }
        .btn-selected-qp {
            background-color: #7c3aed !important; /* Purple */
            border-color: #c084fc !important;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
            color: #ffffff !important;
        }
        .btn-selected-utf32 {
            background-color: #d97706 !important; /* Amber */
            border-color: #fbbf24 !important;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
            color: #ffffff !important;
        }
        .btn-selected-stricthex {
            background-color: #059669 !important; /* Emerald */
            border-color: #34d399 !important;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
            color: #ffffff !important;
        }
        .btn-selected-ascii {
            background-color: #e11d48 !important; /* Rose */
            border-color: #fb7185 !important;
            box-shadow: 0 0 15px rgba(251, 113, 133, 0.4);
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur py-4 px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-envelope-open-text text-amber-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">MIME & Case Converter Tool</h1>
            </div>
            <span class="bg-slate-800 text-slate-300 text-xs px-3 py-1 rounded-full border border-slate-700">
                ASCII / UTF-8 / UTF-32 / Base64 / QP
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl w-full mx-auto p-4 sm:p-6 flex-grow flex flex-col justify-center">
        
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
            
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-white mb-2">Email Subject & Text Case Converter</h2>
                <p class="text-slate-400 text-sm">Decode/Encode email headers ASCII, UTF-8, UTF-32, Base64 and QP support.</p>
            </div>

            <!-- Input Box -->
            <div class="mb-3">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Input Text / Encoded String</label>
                    <button onclick="pasteInput()" class="text-xs text-slate-400 hover:text-slate-200 transition flex items-center gap-1">
                        <i class="fa-regular fa-clipboard"></i> Paste
                    </button>
                </div>
                <textarea id="inputText" rows="4" 
                    class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition font-mono text-sm"
                    placeholder="Enter plain text OR encoded header like:&#10;=?utf-8?q?=48=69=20=67=6F=6F=64=20=6D=6F=72=6E=69=6E=67?=&#10;Hello world example"></textarea>
            </div>

            <!-- Text Case Converters -->
            <div class="mb-6 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                <p class="text-[11px] font-semibold text-sky-400 uppercase tracking-wider mb-2">Text Case Converters:</p>
                <div class="flex flex-wrap gap-2">
                    <button onclick="changeCase('sentence')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        Sentence case
                    </button>
                    <button onclick="changeCase('lower')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        lower case
                    </button>
                    <button onclick="changeCase('upper')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        UPPER CASE
                    </button>
                    <button onclick="changeCase('capitalized')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        Capitalized Case
                    </button>
                    <button onclick="changeCase('alternating')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        aLtErNaTiNg cAsE
                    </button>
                    <button onclick="changeCase('title')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        Title Case
                    </button>
                    <button onclick="changeCase('inverse')" class="case-btn text-xs bg-slate-800 hover:bg-sky-600/30 hover:border-sky-500 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition active:scale-95">
                        InVeRsE CaSe
                    </button>
                </div>
            </div>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-6">
                <!-- Universal Decode -->
                <button id="btn-decode" onclick="process('decode')" 
                    class="action-btn bg-slate-800 hover:bg-teal-600/20 hover:border-teal-500 hover:text-teal-300 hover:shadow-lg hover:shadow-teal-500/20 text-slate-200 font-medium py-3 px-3 rounded-xl transition-all duration-200 border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-key text-sm"></i> Universal Decode
                </button>
                
                <!-- UTF-8 Strict Hex -->
                <button id="btn-encode-stricthex" onclick="process('encode-stricthex')" 
                    class="action-btn bg-slate-800 hover:bg-emerald-600/20 hover:border-emerald-500 hover:text-emerald-300 hover:shadow-lg hover:shadow-emerald-500/20 text-slate-200 font-medium py-3 px-3 rounded-xl transition-all duration-200 border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock text-sm"></i> Strict Hex
                </button>

                <!-- ASCII Base64 / QP -->
                <button id="btn-encode-ascii" onclick="process('encode-ascii')" 
                    class="action-btn bg-slate-800 hover:bg-rose-600/20 hover:border-rose-500 hover:text-rose-300 hover:shadow-lg hover:shadow-rose-500/20 text-slate-200 font-medium py-3 px-3 rounded-xl transition-all duration-200 border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-font text-sm"></i> ASCII QP Header
                </button>
                
                <!-- UTF-8 Base64 -->
                <button id="btn-encode-b64" onclick="process('encode-b64')" 
                    class="action-btn bg-slate-800 hover:bg-blue-600/20 hover:border-blue-500 hover:text-blue-300 hover:shadow-lg hover:shadow-blue-500/20 text-slate-200 font-medium py-3 px-3 rounded-xl transition-all duration-200 border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-[#]"></i> UTF-8 Base64
                </button>
                
                <!-- UTF-8 QP -->
                <button id="btn-encode-qp" onclick="process('encode-qp')" 
                    class="action-btn bg-slate-800 hover:bg-purple-600/20 hover:border-purple-500 hover:text-purple-300 hover:shadow-lg hover:shadow-purple-500/20 text-slate-200 font-medium py-3 px-3 rounded-xl transition-all duration-200 border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-code text-sm"></i> UTF-8 QP
                </button>

                <!-- UTF-32 Base64 -->
                <button id="btn-encode-utf32" onclick="process('encode-utf32')" 
                    class="action-btn bg-slate-800 hover:bg-amber-600/20 hover:border-amber-500 hover:text-amber-300 hover:shadow-lg hover:shadow-amber-500/20 text-slate-200 font-medium py-3 px-3 rounded-xl transition-all duration-200 border border-slate-700 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-layer-group text-sm"></i> UTF-32 Base64
                </button>
            </div>

            <!-- Output Box -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Result Output</label>
                    <button onclick="copyOutput()" class="text-xs text-emerald-400 hover:text-emerald-300 transition flex items-center gap-1">
                        <i class="fa-regular fa-copy"></i> <span id="copyBtnText">Copy</span>
                    </button>
                </div>
                <textarea id="outputText" rows="4" readonly 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-emerald-400 font-mono text-sm focus:outline-none cursor-text shadow-inner"
                    placeholder="Output will appear here..."></textarea>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800">
        by Riyas
    </footer>

    <!-- Protection JavaScript & Conversion Logic -->
    <script>
        // -----------------------------------------------------------------
        // 1. PAGE PROTECTION (RIGHT-CLICK & SHORTCUT DISABLE)
        // -----------------------------------------------------------------
        
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) e.preventDefault(); // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) e.preventDefault(); // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) e.preventDefault(); // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode === 85) e.preventDefault(); // Ctrl+U
            if (e.ctrlKey && e.keyCode === 83) e.preventDefault(); // Ctrl+S
        });

        // -----------------------------------------------------------------
        // 2. TEXT CASE CONVERTER FUNCTIONS
        // -----------------------------------------------------------------

        function changeCase(type) {
            const input = document.getElementById('inputText');
            let text = input.value;
            if (!text) return;

            if (type === 'sentence') {
                text = text.toLowerCase().replace(/(^\s*\w|[\.\?!\n]\s*\w)/g, c => c.toUpperCase());
            } else if (type === 'lower') {
                text = text.toLowerCase();
            } else if (type === 'upper') {
                text = text.toUpperCase();
            } else if (type === 'capitalized') {
                text = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
            } else if (type === 'alternating') {
                text = text.split('').map((c, i) => i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()).join('');
            } else if (type === 'title') {
                const minorWords = ['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'in', 'nor', 'of', 'on', 'or', 'so', 'the', 'to', 'up', 'yet'];
                text = text.toLowerCase().split(' ').map((word, index) => {
                    if (index > 0 && minorWords.includes(word)) return word;
                    return word.charAt(0).toUpperCase() + word.slice(1);
                }).join(' ');
            } else if (type === 'inverse') {
                text = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
            }

            input.value = text;
        }

        // -----------------------------------------------------------------
        // 3. MIME & ASCII CONVERSION LOGIC
        // -----------------------------------------------------------------

        function process(mode) {
            const input = document.getElementById('inputText').value;
            const outputField = document.getElementById('outputText');

            highlightActiveButton(mode);

            if (!input) {
                outputField.value = "Error: Please enter text in the input box first.";
                return;
            }

            try {
                if (mode === 'decode') {
                    outputField.value = decodeMimeSubject(input);
                } else if (mode === 'encode-stricthex') {
                    outputField.value = encodeStrictHexSubject(input);
                } else if (mode === 'encode-ascii') {
                    outputField.value = encodeASCIISubject(input);
                } else if (mode === 'encode-b64') {
                    outputField.value = encodeBase64Subject(input);
                } else if (mode === 'encode-qp') {
                    outputField.value = encodeQPSubject(input);
                } else if (mode === 'encode-utf32') {
                    outputField.value = encodeUTF32Subject(input);
                }
            } catch (err) {
                outputField.value = "Error parsing string. Please check input format.";
            }
        }

        function highlightActiveButton(mode) {
            const btnMap = {
                'decode': { id: 'btn-decode', class: 'btn-selected-decode' },
                'encode-stricthex': { id: 'btn-encode-stricthex', class: 'btn-selected-stricthex' },
                'encode-ascii': { id: 'btn-encode-ascii', class: 'btn-selected-ascii' },
                'encode-b64': { id: 'btn-encode-b64', class: 'btn-selected-b64' },
                'encode-qp': { id: 'btn-encode-qp', class: 'btn-selected-qp' },
                'encode-utf32': { id: 'btn-encode-utf32', class: 'btn-selected-utf32' }
            };

            Object.values(btnMap).forEach(item => {
                const btn = document.getElementById(item.id);
                if (btn) btn.classList.remove('btn-selected-decode', 'btn-selected-stricthex', 'btn-selected-ascii', 'btn-selected-b64', 'btn-selected-qp', 'btn-selected-utf32');
            });

            if (btnMap[mode]) {
                const activeBtn = document.getElementById(btnMap[mode].id);
                if (activeBtn) activeBtn.classList.add(btnMap[mode].class);
            }
        }

        // Universal Decode Function
        function decodeMimeSubject(text) {
            let src = text.trim();

            const regex = /=\?([^?]+)\?([BQbq])\?([^?]+)\?=/g;
            if (regex.test(src)) {
                return src.replace(/=\?([^?]+)\?([BQbq])\?([^?]+)\?=/g, (match, charset, encoding, data) => {
                    const enc = encoding.toUpperCase();
                    const cs = charset.toUpperCase();

                    if (enc === 'B') {
                        const binary = atob(data);
                        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));

                        if (cs.includes('UTF-32')) {
                            let result = '';
                            for (let i = 0; i < bytes.length; i += 4) {
                                const codePoint = (bytes[i] << 24) | (bytes[i + 1] << 16) | (bytes[i + 2] << 8) | bytes[i + 3];
                                result += String.fromCodePoint(codePoint);
                            }
                            return result;
                        } else {
                            return new TextDecoder(charset).decode(bytes);
                        }
                    } else if (enc === 'Q') {
                        let qpDecoded = data.replace(/_/g, ' ');
                        qpDecoded = qpDecoded.replace(/=([0-9A-Fa-f]{2})/g, (_, hex) => {
                            return String.fromCharCode(parseInt(hex, 16));
                        });
                        const bytes = Uint8Array.from(qpDecoded, char => char.charCodeAt(0));
                        return new TextDecoder(charset).decode(bytes);
                    }
                    return match;
                });
            }

            // Raw Hex or Unwrapped Quoted Printable
            let qpDecoded = src.replace(/_/g, ' ');
            qpDecoded = qpDecoded.replace(/=([0-9A-Fa-f]{2})/g, (_, hex) => {
                return String.fromCharCode(parseInt(hex, 16));
            });
            const bytes = Uint8Array.from(qpDecoded, char => char.charCodeAt(0));
            return new TextDecoder('utf-8').decode(bytes);
        }

        // Encode Functions
        function encodeStrictHexSubject(text) {
            const bytes = new TextEncoder().encode(text);
            let hexStr = '';
            bytes.forEach(byte => {
                hexStr += '=' + byte.toString(16).toUpperCase().padStart(2, '0');
            });
            return `=?utf-8?q?${hexStr}?=`;
        }

        function encodeASCIISubject(text) {
            let qp = '';
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code > 127) {
                    qp += '=' + code.toString(16).toUpperCase().padStart(2, '0');
                } else if (code === 32) {
                    qp += '_';
                } else if ((code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122)) {
                    qp += text.charAt(i);
                } else {
                    qp += '=' + code.toString(16).toUpperCase().padStart(2, '0');
                }
            }
            return `=?us-ascii?Q?${qp}?=`;
        }

        function encodeBase64Subject(text) {
            const bytes = new TextEncoder().encode(text);
            let binary = '';
            bytes.forEach(b => binary += String.fromCharCode(b));
            return `=?UTF-8?B?${btoa(binary)}?=`;
        }

        function encodeQPSubject(text) {
            const bytes = new TextEncoder().encode(text);
            let qp = '';
            bytes.forEach(byte => {
                if (byte === 32) {
                    qp += '_';
                } else if ((byte >= 48 && byte <= 57) || (byte >= 65 && byte <= 90) || (byte >= 97 && byte <= 122)) {
                    qp += String.fromCharCode(byte);
                } else {
                    qp += '=' + byte.toString(16).toUpperCase().padStart(2, '0');
                }
            });
            return `=?UTF-8?Q?${qp}?=`;
        }

        function encodeUTF32Subject(text) {
            const codePoints = Array.from(text).map(c => c.codePointAt(0));
            const bytes = new Uint8Array(codePoints.length * 4);

            codePoints.forEach((cp, index) => {
                const offset = index * 4;
                bytes[offset]     = (cp >> 24) & 0xFF;
                bytes[offset + 1] = (cp >> 16) & 0xFF;
                bytes[offset + 2] = (cp >> 8)  & 0xFF;
                bytes[offset + 3] = cp & 0xFF;
            });

            let binary = '';
            bytes.forEach(b => binary += String.fromCharCode(b));
            return `=?UTF-32?B?${btoa(binary)}?=`;
        }

        // -----------------------------------------------------------------
        // 4. SAFE COPY & PASTE (WITH FALLBACK FOR RESTRICTED IFRAMES)
        // -----------------------------------------------------------------

        function copyOutput() {
            const output = document.getElementById('outputText');
            if (!output.value) return;

            output.select();
            output.setSelectionRange(0, 99999); // Mobile compatibility

            try {
                // Try modern API first
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(output.value).then(showCopySuccess).catch(() => {
                        fallbackCopy(output);
                    });
                } else {
                    fallbackCopy(output);
                }
            } catch (err) {
                fallbackCopy(output);
            }
        }

        function fallbackCopy(element) {
            try {
                document.execCommand('copy');
                showCopySuccess();
            } catch (err) {
                alert('Copy failed. Please manually select and copy text.');
            }
        }

        function showCopySuccess() {
            const copyText = document.getElementById('copyBtnText');
            copyText.innerText = "Copied!";
            setTimeout(() => copyText.innerText = "Copy", 2000);
        }

        async function pasteInput() {
            const inputField = document.getElementById('inputText');
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    inputField.value = text;
                } else {
                    alert('Clipboard paste permission blocked by browser. Please use Ctrl+V to paste manually.');
                }
            } catch (err) {
                alert('Clipboard paste permission blocked. Please use Ctrl+V / Command+V to paste manually.');
            }
        }

        function setSample(val) {
            document.getElementById('inputText').value = val;
        }
    </script>
</body>
</html>
